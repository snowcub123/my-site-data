name: 豆瓣数据同步
on:
  # 定时自动执行：北京时间每天早上9点抓取一次
  schedule:
    - cron: "0 1 * * *"
  # 允许手动点击按钮立即运行（强烈保留）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6

      # 清空旧数据文件夹
      - name: 清理旧数据
        shell: bash
        run: |
          rm -rf ./data
          mkdir -p ./data

      # ========== 同步电影 movie ==========
      - name: 同步豆瓣电影
        uses: somkanel/douban-sync-action@v1.0.0
        with:
          id: 224705884
          type: movie
          format: json
          dir: ./data
        env:
          DOUBAN_COOKIE: ${{ secrets.DOUBAN_COOKIE }}

      # ========== 同步书籍 book（需要就保留，不需要直接删除这一段） ==========
      - name: 同步豆瓣书籍
        uses: somkanel/douban-sync-action@v1.0.0
        with:
          id: 【替换成你的豆瓣ID】
          type: book
          format: json
          dir: ./data
        env:
          DOUBAN_COOKIE: ${{ secrets.DOUBAN_COOKIE }}

      # ========== 同步音乐 music（需要就保留） ==========
      - name: 同步豆瓣音乐
        uses: somkanel/douban-sync-action@v1.0.0
        with:
          id: 224705884
          type: music
          format: json
          dir: ./data
        env:
          DOUBAN_COOKIE: ${{ secrets.DOUBAN_COOKIE }}

      # 自动提交文件保存到仓库
      - name: 提交更新的数据
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./data
          if ! git diff-index --quiet HEAD; then
            git commit -m "自动同步豆瓣书影音数据"
            git push
          else
            echo "暂无新数据"
          fi
